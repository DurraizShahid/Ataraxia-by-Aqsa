<text x="340" y="244" style="fill:rgb(212, 175, 55);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:0.9;font-family:&quot;Palatino Linotype&quot;, Palatino, serif;font-size:11px;font-weight:400;text-anchor:middle;dominant-baseline:auto">INTEGRATION</text>
<text x="340" y="262" style="fill:rgb(85, 85, 85);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:Georgia, serif;font-size:11px;font-weight:400;text-anchor:middle;dominant-baseline:auto">is the real transformation</text>

<!-- SELF label — top -->
<text x="340" y="110" style="fill:rgb(212, 175, 55);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Palatino Linotype&quot;, Palatino, serif;font-size:14px;font-weight:500;text-anchor:middle;dominant-baseline:auto">SELF</text>
